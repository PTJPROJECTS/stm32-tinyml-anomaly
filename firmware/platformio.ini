; STM32 NUCLEO-F446RE (Cortex-M4F, 180 MHz, 512 KB flash, 128 KB RAM)
; Run ../tools/fetch_tflm.sh first, it creates lib/tflm.

[platformio]
src_dir = src

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++14 -std=gnu++17
build_flags =
    -std=gnu++17
    -O2
    -I../core
    -Ilib/tflm
    -Ilib/tflm/third_party/flatbuffers/include
    -Ilib/tflm/third_party/cmsis_nn
    -Ilib/tflm/third_party/cmsis_nn/Include
    -DTF_LITE_STATIC_MEMORY
    -DCMSIS_NN
    -DARM_MATH_DSP
    -DARM_MATH_LOOPUNROLL
    -Wl,--print-memory-usage
; core/ is shared with the host build
build_src_filter = +<*> +<../../core/*.c> +<../../core/*.cc>
lib_ldf_mode = deep+
